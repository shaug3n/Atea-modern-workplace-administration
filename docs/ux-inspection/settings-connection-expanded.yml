          - group [ref=f46e74] [box=297,778,1071,592]:
            - generic "Delegated permissions and tenant consent" [active] [ref=f46e75] [cursor=pointer] [box=314,795,1037,28]
            - paragraph [ref=f46e177] [box=314,823,1037,56]: "These are separate steps: Atea configures delegated scopes on the API app registration first; a customer Entra administrator then grants tenant consent. Tenant consent cannot add scopes that are missing from the app registration."
            - list [ref=f46e178] [box=314,895,1037,246]:
              - listitem [ref=f46e179] [box=354,895,997,29]:
                - strong [ref=f46e180] [box=354,899,215,20]: "Users, groups and licenses:"
                - code [ref=f46e181] [box=573,900,125,19]: User.Read.All
                - text: ","
                - code [ref=f46e182] [box=708,900,135,19]: Group.Read.All
                - text: ","
                - code [ref=f46e183] [box=851,900,173,19]: Directory.Read.All
                - text: .
              - listitem [ref=f46e184] [box=354,928,997,57]:
                - strong [ref=f46e185] [box=354,932,67,20]: "Devices:"
                - code [ref=f46e186] [box=426,933,376,19]: DeviceManagementManagedDevices.Read.All
                - text: . Device actions require additional delegated write scopes and an active tenant role; an eligible but inactive PIM role must be activated first.
              - listitem [ref=f46e187] [box=354,989,997,57]:
                - strong [ref=f46e188] [box=354,993,152,20]: "BitLocker recovery:"
                - code [ref=f46e189] [box=510,994,250,19]: BitlockerKey.ReadBasic.All
                - text: reads key metadata;
                - code [ref=f46e190] [box=922,994,202,19]: BitlockerKey.Read.All
                - text: permits a deliberate key reveal.
              - listitem [ref=f46e191] [box=354,1050,997,58]:
                - strong [ref=f46e192] [box=354,1054,196,20]: "Windows LAPS recovery:"
                - code [ref=f46e193] [box=555,1055,337,19]: DeviceLocalCredential.ReadBasic.All
                - text: reads backup metadata;
                - code [ref=f46e194] [box=354,1084,289,19]: DeviceLocalCredential.Read.All
                - text: permits a deliberate password reveal.
              - listitem [ref=f46e195] [box=354,1112,997,29]:
                - strong [ref=f46e196] [box=354,1116,174,20]: "Exchange verification:"
                - code [ref=f46e197] [box=533,1117,193,19]: MailboxSettings.Read
                - text: ", in addition to the directory-read scopes above."
            - paragraph [ref=f46e198] [box=314,1157,1037,112]: These four recovery scopes must first be added as Microsoft Graph delegated permissions to the API app registration by the Atea app owner. A customer tenant administrator must then grant tenant consent separately. Consent cannot add a scope missing from the registration. An eligible Entra PIM role may need activation; Graph makes the final access decision for the specific device and recovery record.
            - paragraph [ref=f46e199] [box=314,1269,1037,84]: If a scope is absent from the API registration, ask the Atea app owner to add it before retrying consent. If the scope is present but not granted in this tenant, use the consent action above with an appropriately authorized tenant administrator. If the permission check reports PIM activation required, activate the eligible role in Entra PIM and retry.
          - paragraph [ref=f46e76] [box=297,1386,1071,56]: A customer or Atea administrator with the required tenant permissions can complete the consent step. Your Entra roles continue to control which Microsoft 365 actions are available.
