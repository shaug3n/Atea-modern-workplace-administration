name: Provision test foundation

on:
  workflow_dispatch:
    inputs:
      confirm_test_subscription:
        description: 'Confirm this is the disposable personal test subscription (not Atea production)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provision-foundation:
    if: inputs.confirm_test_subscription == true
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: workplace-test-foundation
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
      AZURE_PROVISION_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_PROVISION_PRINCIPAL_OBJECT_ID }}
      AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      AZURE_DB_BOOTSTRAP_JOB_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}-db-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_PROVISION_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify the exact target subscription and resource group
        run: |
          test -n "$AZURE_RESOURCE_GROUP"
          test "$(az account show --query id -o tsv)" = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          test "$(az account show --query tenantId -o tsv)" = "${{ secrets.AZURE_TENANT_ID }}"
          test -n "$AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID"
          test -n "$AZURE_PROVISION_PRINCIPAL_OBJECT_ID"
          test "$(az group show --name "$AZURE_RESOURCE_GROUP" --query location -o tsv)" = "$AZURE_LOCATION"
      - name: Preview foundation resources
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          test -n "$POSTGRES_ADMIN_PASSWORD"
          az deployment group what-if --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep --parameters @infra/parameters/dev.json \
            postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" deploymentPrincipalObjectId="$AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
            provisionPrincipalObjectId="$AZURE_PROVISION_PRINCIPAL_OBJECT_ID" --no-pretty-print
      - name: Create foundation (billable resources)
        id: foundation
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          az deployment group create --name workplace-foundation --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep --parameters @infra/parameters/dev.json \
            postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" deploymentPrincipalObjectId="$AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
            provisionPrincipalObjectId="$AZURE_PROVISION_PRINCIPAL_OBJECT_ID" --output none
          {
            echo '### Test Azure foundation provisioned'
            echo "Resource group: $AZURE_RESOURCE_GROUP"
            echo 'Foundation outputs are available in the Azure deployment named workplace-foundation.'
            echo 'Next: verify the generated host, register exact Entra redirect URIs, bootstrap DB roles, and seed Key Vault secrets using docs/operations/azure-deployment.md.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and push the one-time PostgreSQL bootstrap image
        run: |
          test -n "$AZURE_ACR_NAME"
          docker build --file infra/scripts/db-bootstrap.Dockerfile \
            --tag "$AZURE_ACR_NAME.azurecr.io/atea-database-bootstrap:$GITHUB_SHA" .
          for attempt in $(seq 1 12); do
            if az acr login --name "$AZURE_ACR_NAME"; then break; fi
            test "$attempt" -lt 12 || { echo 'ACR push permission did not become available.'; exit 1; }
            sleep 10
          done
          docker push "$AZURE_ACR_NAME.azurecr.io/atea-database-bootstrap:$GITHUB_SHA"
      - name: Create database roles and seed runtime secrets from inside the private VNet
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AZURE_KEY_VAULT_NAME" && test -n "$POSTGRES_ADMIN_PASSWORD"
          foundation="$(az deployment group show --name workplace-foundation --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs -o json)"
          out() { echo "$foundation" | jq -r ".${1}.value"; }
          key_vault="$(out keyVaultUri)"
          identity_id="$(out workloadIdentityResourceId)"
          environment_id="$(out containerAppsEnvironmentResourceId)"
          registry="$(out acrLoginServer)"
          database_host="$(out postgresFqdn)"
          database_name="$(out postgresDatabaseName)"
          admin_login="$(out postgresAdminLogin)"
          runtime_password="$(openssl rand -hex 32)"
          migration_password="$(openssl rand -hex 32)"
          consent_key="$(openssl rand -base64 48)"
          continuation_key="$(openssl rand -hex 32)"
          for secret in "$runtime_password" "$migration_password" "$consent_key" "$continuation_key" "$POSTGRES_ADMIN_PASSWORD"; do echo "::add-mask::$secret"; done
          set_secret() {
            name="$1"
            value="$2"
            az keyvault secret recover --vault-name "$AZURE_KEY_VAULT_NAME" --name "$name" --output none >/dev/null 2>&1 || true
            for attempt in $(seq 1 12); do
              if az keyvault secret set --vault-name "$AZURE_KEY_VAULT_NAME" --name "$name" --value "$value" --output none; then return 0; fi
              test "$attempt" -lt 12 || return 1
              sleep 10
            done
          }
          cleanup() {
            az containerapp job delete --name "$AZURE_DB_BOOTSTRAP_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --yes --output none >/dev/null 2>&1 || true
            for name in postgres-bootstrap-admin-password postgres-bootstrap-migration-password postgres-bootstrap-runtime-password; do
              az keyvault secret delete --vault-name "$AZURE_KEY_VAULT_NAME" --name "$name" --output none >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          set_secret postgres-bootstrap-admin-password "$POSTGRES_ADMIN_PASSWORD"
          set_secret postgres-bootstrap-migration-password "$migration_password"
          set_secret postgres-bootstrap-runtime-password "$runtime_password"
          az deployment group create --name workplace-database-bootstrap --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/database-bootstrap.bicep \
            --parameters location="$AZURE_LOCATION" jobName="$AZURE_DB_BOOTSTRAP_JOB_NAME" \
            containerAppsEnvironmentResourceId="$environment_id" workloadIdentityResourceId="$identity_id" \
            registryLoginServer="$registry" imageTag="$GITHUB_SHA" keyVaultUri="$key_vault" \
            postgresServerFqdn="$database_host" postgresDatabaseName="$database_name" postgresAdminLogin="$admin_login" --output none
          execution="$(az containerapp job start --name "$AZURE_DB_BOOTSTRAP_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query name -o tsv)"
          test -n "$execution"
          completed=false
          for attempt in $(seq 1 60); do
            status="$(az containerapp job execution show --name "$AZURE_DB_BOOTSTRAP_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --job-execution-name "$execution" --query properties.status -o tsv)"
            case "$status" in
              Succeeded) completed=true; break ;;
              Failed|Canceled|Degraded) echo "Private PostgreSQL role bootstrap failed ($status). No application deployment was started."; exit 1 ;;
            esac
            sleep 10
          done
          test "$completed" = true || { echo 'PostgreSQL bootstrap job exceeded its ten-minute timeout.'; exit 1; }
          runtime_connection="Host=$database_host;Port=5432;Database=$database_name;Username=workplace_runtime;Password=$runtime_password;SSL Mode=VerifyFull;Timeout=15;Command Timeout=30"
          migration_connection="Host=$database_host;Port=5432;Database=$database_name;Username=workplace_migrator;Password=$migration_password;SSL Mode=VerifyFull;Timeout=15;Command Timeout=30"
          set_secret workplace-db "$runtime_connection"
          set_secret workplace-migration-db "$migration_connection"
          set_secret consent-signing-key "$consent_key"
          set_secret continuation-signing-key "$continuation_key"
          echo 'PostgreSQL roles were initialized through a one-time private Container Apps Job; runtime and migration connection strings and signing keys were stored in Key Vault.' >> "$GITHUB_STEP_SUMMARY"
