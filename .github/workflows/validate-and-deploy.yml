name: Validate and deploy

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'infra/**'
      - '.github/workflows/validate-and-deploy.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Non-production deployment target'
        required: true
        default: dev
        type: choice
        options: [dev]

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: atea-unified-workplace
  IMAGE_TAG: ${{ github.sha }}
  AZURE_CORE_OUTPUT: none

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - name: API tests
        run: dotnet test Atea.UnifiedWorkplace.sln --configuration Release
      - name: Frontend tests and build
        run: |
          npm ci --prefix src/Web
          npm run test:behavior --prefix src/Web -- --run
          npm run build --prefix src/Web
      - name: Compose contract and image build
        run: |
          docker compose config --quiet
          docker compose build
      - name: Build the exact deployment image once
        run: |
          docker build \
            --build-arg VITE_ENTRA_CLIENT_ID="${{ vars.ENTRA_CLIENT_ID }}" \
            --build-arg VITE_ENTRA_API_SCOPE="${{ vars.ENTRA_API_SCOPE }}" \
            --build-arg VITE_ENTRA_AUTHORITY="${{ vars.ENTRA_AUTHORITY }}" \
            --build-arg VITE_ENTRA_REDIRECT_URI="${{ vars.ENTRA_REDIRECT_URI }}" \
            --tag "$IMAGE_REPOSITORY:$IMAGE_TAG" .
          docker save "$IMAGE_REPOSITORY:$IMAGE_TAG" --output /tmp/atea-unified-workplace-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: atea-unified-workplace-image-${{ github.sha }}
          path: /tmp/atea-unified-workplace-image.tar
          if-no-files-found: error

  dependency-security:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Node dependency audit
        run: npm ci --prefix src/Web && npm audit --prefix src/Web --omit=dev --audit-level=high
      - name: .NET vulnerable package audit
        run: dotnet list src/Api/Atea.UnifiedWorkplace.Api.csproj package --vulnerable --include-transitive
      - name: Filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  validate-infra:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local infrastructure contract validation
        run: python3 infra/tests/validate_contract.py
      - name: Bicep compile
        run: az bicep build --file infra/main.bicep --outfile /tmp/atea-unified-workplace-main.json

  deploy-nonproduction:
    if: github.event_name == 'workflow_dispatch'
    needs: [build-test, dependency-security, validate-infra]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_MIGRATION_JOB_NAME: ${{ vars.AZURE_MIGRATION_JOB_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: atea-unified-workplace-image-${{ github.sha }}
          path: /tmp/atea-image
      - name: Push immutable image
        run: |
          docker load --input /tmp/atea-image/atea-unified-workplace-image.tar
          az acr login --name "$AZURE_ACR_NAME"
          docker tag "$IMAGE_REPOSITORY:$IMAGE_TAG" "$AZURE_ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker push "$AZURE_ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$IMAGE_TAG"
      - name: Bicep what-if against non-production resource group
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters @infra/parameters/dev.json \
            imageTag="$IMAGE_TAG" \
            postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
            --no-pretty-print
      - name: Database migration job
        run: |
          test -n "$AZURE_MIGRATION_JOB_NAME"
          az containerapp job update \
            --name "$AZURE_MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$IMAGE_TAG" \
            --output none
          execution="$(az containerapp job start --name "$AZURE_MIGRATION_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query name -o tsv)"
          test -n "$execution"
          for attempt in $(seq 1 30); do
            status="$(az containerapp job execution show --name "$AZURE_MIGRATION_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --job-execution-name "$execution" --query properties.status -o tsv)"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Canceled|Degraded) echo "Migration job ended with status: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo 'Migration job did not complete within the bounded wait window.'
          exit 1
      - name: Deploy revision
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$IMAGE_TAG" \
            --revision-suffix "$IMAGE_TAG" \
            --revisions-mode multiple \
            --output none
      - name: Smoke test new revision
        id: smoke
        run: |
          fqdn="$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestRevisionFqdn -o tsv)"
          curl --fail --silent --show-error "https://$fqdn/health" >/dev/null
      - name: Route customer traffic only after smoke test
        if: steps.smoke.outcome == 'success'
        run: |
          revision="$(az containerapp revision list --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "[?properties.template.revisionSuffix=='$IMAGE_TAG'].name | [0]" -o tsv)"
          test -n "$revision"
          az containerapp ingress traffic set \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision-weight "$revision=100" \
            --output none
