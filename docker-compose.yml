services:
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__WorkplaceDb: Host=postgres;Port=5432;Database=workplace;Username=workplace;Password=workplace
      AteaAdmin__LocalDevelopment__Enabled: ${AteaAdmin__LocalDevelopment__Enabled:-true}
      AteaAdmin__LocalDevelopment__Username: ${AteaAdmin__LocalDevelopment__Username:-local-admin}
      AteaAdmin__LocalDevelopment__Password: ${AteaAdmin__LocalDevelopment__Password:-change-me-locally}
      AteaAdmin__LocalDevelopment__ObjectId: ${AteaAdmin__LocalDevelopment__ObjectId:-00000000-0000-0000-0000-000000000001}
      AteaAdmin__LocalDevelopment__DisplayName: ${AteaAdmin__LocalDevelopment__DisplayName:-Local Atea Administrator}
      AteaAdmin__LocalDevelopment__AllowAllWorkspaces: ${AteaAdmin__LocalDevelopment__AllowAllWorkspaces:-true}
      Onboarding__PublicBaseUrl: ${Onboarding__PublicBaseUrl:-http://localhost:5173}
      Onboarding__ConsentRedirectUri: ${Onboarding__ConsentRedirectUri:-http://localhost:5173/onboarding/consent/callback}
      Onboarding__ConsentSigningKey: ${Onboarding__ConsentSigningKey:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: { context: ., target: web }
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports: ["5173:5173"]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: workplace, POSTGRES_USER: workplace, POSTGRES_PASSWORD: workplace }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U workplace -d workplace"], interval: 5s, timeout: 5s, retries: 10 }
    volumes: [workplace-data:/var/lib/postgresql/data]
volumes: { workplace-data: }
